security:
    password_hashers:
        App\Entity\Usuarios: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Usuarios
                property: correoElectronico

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            stateless: true
            # La autenticación se resuelve en App\Controller\SecurityController
            # (POST /api/login) validando la contraseña con UserPasswordHasherInterface.

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        # Dejamos PUBLIC_ACCESS temporalmente mientras pruebas en Android/Swagger;
        # luego lo cambiaremos a IS_AUTHENTICATED_FULLY
        - { path: ^/api, roles: PUBLIC_ACCESS }